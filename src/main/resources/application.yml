### JSF CONFIGS ###
server:
  context_parameters:
    com:
      sun:
        faces:
          forceLoadConfiguration: true


### H2 ###"
spring:
  datasource:
    url: jdbc:h2:file:./data/ticketsystem
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        use_sql_comments: true
        format_sql: true
  h2:
    console.enabled: true

logging:
  level:
    org:
      hibernate:
        type: trace