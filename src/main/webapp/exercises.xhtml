<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <script>
    </script>
</h:head>

<f:metadata>
    <f:viewAction action="#{userManager.checkSignedIn}" />
</f:metadata>



<!-- src/main/webapp/exercises.xhtml -->
<ui:composition template="/templates/page-template.xhtml">
    <ui:param name="pageTitle" value="Available Exercises"/>
    <ui:define name="panel-main">
        <section class="p-6 bg-white rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-3xl font-bold">Available Exercises</h1>
            </div>
            <ui:include src="/templates/exercises_search_template.xhtml">
            </ui:include>
            <ui:repeat value="#{exerciseBean.exercises}" var="exercise">
                <ui:include src="/templates/exercise-template.xhtml">
                    <ui:param name="exercise" value="#{exercise}"/>
                </ui:include>
            </ui:repeat>
        </section>
    </ui:define>
</ui:composition>
</html>
