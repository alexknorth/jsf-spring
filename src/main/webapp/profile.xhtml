<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/templates/page-template.xhtml">
    <f:metadata>
        <f:viewAction action="#{userDetails.onload}"/>
    </f:metadata>
    <ui:param name="pageTitle" value="User Details"/>

    <ui:define name="panel-main">
        <section>
            <h:messages styleClass="validation-messages"/>
            <h:form>
                <p:panelGrid columns="2" layout="flex"
                             columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                             styleClass="customPanelGrid" contentStyleClass="ui-fluid" responsive="true">
                    <!-- Username -->
                    <p:outputLabel for="username" value="Username"/>
                    <p:inputText id="username"
                                 value="#{userDetails.user.username}"
                                 required="true"
                                 requiredMessage="Please enter a username."
                                 validatorMessage="Please enter a username consisting of only letters and digits, between 2 and 20 characters long."
                                 readonly="#{userManager.signedIn}">
                        <f:validateRegex pattern="[A-Za-z0-9]{2,20}"/>
                    </p:inputText>

                    <!-- Password -->
                    <p:outputLabel for="password" value="Password"/>
                    <p:password id="password"
                                value="#{userDetails.user.password}"
                                required="true"
                                requiredMessage="Please enter a password.">
                        <p:ajax event="keyup" listener="#{userDetails.validatePasswordStrength}" update="passwordStrengthOutput"/>
                    </p:password>
                    <p:outputLabel id="passwordStrengthOutput" value="#{userDetails.passwordStrength}"/>

                    <!-- First Name -->
                    <p:outputLabel for="firstName" value="First Name"/>
                    <p:inputText id="firstName"
                                 value="#{userDetails.user.firstName}"
                                 required="true"
                                 requiredMessage="Please enter your first name."
                                 maxlength="30"/>

                    <!-- Last Name -->
                    <p:outputLabel for="lastName" value="Last Name"/>
                    <p:inputText id="lastName"
                                 value="#{userDetails.user.lastName}"
                                 required="true"
                                 requiredMessage="Please enter your last name."
                                 maxlength="30"/>

                    <!-- Email Address -->
                    <p:outputLabel for="emailAddress" value="E-mail Address"/>
                    <p:inputText id="emailAddress"
                                 value="#{userDetails.user.emailAddress}"
                                 required="true"
                                 requiredMessage="Please enter your email address."/>

                    <!-- Phone Number -->
                    <p:outputLabel for="phoneNumber" value="Phone Number"/>
                    <p:inputText id="phoneNumber"
                                 value="#{userDetails.user.phoneNumber}"
                                 maxlength="20"/>

                    <!-- Birth Date -->
                    <p:outputLabel for="birthDate" value="Birth Date"/>
                    <p:calendar id="birthDate"
                                value="#{userDetails.user.birthDate}"
                                required="true"
                                requiredMessage="Please select your birthdate."
                                pattern="yyyy-MM-dd"/>

                    <!-- Subscribe to Newsletter -->
                    <p:outputLabel for="subscribedToNewsletter" value="Subscribe to the Newsletter?"/>
                    <p:selectOneRadio id="subscribedToNewsletter" value="#{userDetails.user.subscribedToNewsletter}" required="true" requiredMessage="Please select an option.">
                        <f:selectItem itemValue="true" itemLabel="Yes"/>
                        <f:selectItem itemValue="false" itemLabel="No"/>
                    </p:selectOneRadio>

                    <!-- Height -->
                    <p:outputLabel for="height" value="Height (cm)"/>
                    <p:inputText id="height" value="#{userDetails.user.height}"/>

                    <!-- Weight -->
                    <p:outputLabel for="weight" value="Weight (kg)"/>
                    <p:inputText id="weight"
                                 value="#{userDetails.user.weight}"
                                 required="true"
                                 requiredMessage="Please enter your weight."/>

                    <!-- Calorie Intake -->
                    <p:outputLabel for="calorieIntake" value="Calorie Intake (kcal)"/>
                    <p:inputText id="calorieIntake" value="#{userDetails.user.calorieIntake}"/>

                    <!-- Body Fat Percentage -->
                    <p:outputLabel for="bodyfatPercentage" value="Body Fat Percentage (%)"/>
                    <p:inputText id="bodyfatPercentage" value="#{userDetails.user.bodyfatPercentage}"/>

                    <!-- Submit Button -->
                    <p:outputLabel/>
                    <p:commandButton value="Submit" action="#{userDetails.submit}"/>
                </p:panelGrid>
            </h:form>
        </section>
    </ui:define>

    <ui:define name="top-message">
        <div class="welcome-message text-center mt-4">
            <ui:fragment rendered="#{not userManager.signedIn}">
                <h1>Welcome, visitor!</h1>
                <p>
                    Please <h:outputLink value="sign-in.xhtml">sign in</h:outputLink>
                    or <h:outputLink value="profile.xhtml">register</h:outputLink>.
                </p>
            </ui:fragment>

            <ui:fragment rendered="#{userManager.signedIn}">
                <h1>Welcome, #{userManager.currentUser.firstName}!</h1>
                <p>
                    View and update your profile or sign out.
                </p>
            </ui:fragment>
        </div>
    </ui:define>
</ui:composition>
</html>
