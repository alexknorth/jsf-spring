<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/templates/page-template.xhtml">
    <ui:param name="pageTitle" value="Recent Workouts"/>

    <ui:define name="panel-main">
        <section class="p-6 bg-white rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">Recent Workouts</h2>
            <ui:repeat value="#{workoutBean.completedWorkouts}" var="workout">
                <div class="mb-6 p-4 border rounded-lg shadow-sm">
                    <h3 class="text-xl font-semibold">Template: #{workout.template.name}</h3>
                    <p class="text-gray-600">Date: #{workout.getDate()}</p>
                    <p class="text-gray-600">Total Time: #{workout.getTotalTime()}</p>
                    <p class="text-gray-600">Total Weight: #{workout.getTotalWeight()}</p>
                </div>
            </ui:repeat>
        </section>
    </ui:define>
</ui:composition>
</html>
