<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Workout Erstellen</title>
</h:head>

<!-- src/main/webapp/start-template.xhtml -->
<ui:composition template="/templates/page-template.xhtml">
    <ui:param name="pageTitle" value="Workout Erstellen"/>
    <ui:define name="panel-main">
        <h:form id="workoutForm">
            <section class="p-6 bg-white rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Template: #{templateBean.selectedTemplate.name}</h2>
                    <p:commandButton value="Beenden" styleClass="ui-button-raised ui-button-success"
                                     oncomplete="PF('endWorkoutDialog').show(); return false;"/>
                </div>
                <ui:repeat value="#{workoutBean.exercises}" var="workoutExercise">
                    <div class="mb-6 p-4 bg-gray-100 rounded shadow">
                        <h3 class="text-lg font-semibold text-blue-600">#{workoutExercise.exercise.name}</h3>
                        <p:dataTable value="#{workoutExercise.sets}" var="set" class="mt-2">
                            <p:column headerText="Set">
                                <h:outputText value="#{workoutExercise.getSetOrder(set)}"/>
                            </p:column>
                            <p:column headerText="KG">
                                <p:inputText id="weight" value="#{set.weight}" size="5" required="true" label="Weight">
                                    <f:validateDoubleRange minimum="0.0"/>
                                    <p:ajax update="msgWeight" event="keyup"/>
                                </p:inputText>
                                <p:message for="weight" id="msgWeight" display="icon"/>
                            </p:column>
                            <p:column headerText="Reps">
                                <p:inputText id="reps" value="#{set.reps}" size="5" required="true" label="Reps">
                                    <f:validateLongRange minimum="1"/>
                                    <p:ajax update="msgReps" event="keyup"/>
                                </p:inputText>
                                <p:message for="reps" id="msgReps" display="icon"/>
                            </p:column>
                            <p:column headerText="Pause (s)">
                                <p:inputText id="restTime" value="#{set.restTime}" size="5" required="true" label="Rest Time">
                                    <f:validateLongRange minimum="0"/>
                                    <p:ajax update="msgRestTime" event="keyup"/>
                                </p:inputText>
                                <p:message for="restTime" id="msgRestTime" display="icon"/>
                            </p:column>
                            <p:column headerText="✔">
                                <p:selectBooleanCheckbox value="#{set.completed}"/>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton value="+ Set" actionListener="#{workoutBean.addSet(workoutExercise)}"
                                         update="@form" styleClass="ui-button-raised"/>
                    </div>
                </ui:repeat>
                <div class="flex flex-col space-y-4">
                    <p:commandButton value="Übung hinzufügen" styleClass="ui-button-raised"
                                     onclick="PF('addExerciseDialog').show(); return false;"/>
                    <p:commandButton value="Workout abbrechen" action="#{workoutBean.cancelWorkout}"
                                     styleClass="ui-button-raised ui-button-danger" immediate="true"/>
                </div>
            </section>
            <p:dialog header="Übung hinzufügen" widgetVar="addExerciseDialog" modal="true" width="400">
                    <ui:include src="/templates/exercises_search_template.xhtml">
                    </ui:include>
                    <ui:repeat value="#{exerciseBean.exercises}" var="exercise">
                        <ui:include src="/templates/exercise-template.xhtml">
                            <ui:param name="exercise" value="#{exercise}"/>
                        </ui:include>

                        <p:commandButton value="Add" action="#{workoutBean.addExercise(exercise)}"
                                         oncomplete="PF('addExerciseDialog').hide();"
                                         update=":workoutForm"
                                         styleClass="ui-button-raised ui-button-success"/>
                    </ui:repeat>
            </p:dialog>

            <p:dialog header="Workout abbrechen" widgetVar="endWorkoutDialog" modal="true" width="400">
                <div class="flex justify-end gap-4">
                    <p>Willst du das Workout wirklich beenden?</p>
                    <p:commandButton value="Ja" action="#{workoutBean.finishWorkout}"
                                     styleClass="ui-button-raised"/>
                    <p:commandButton value="Nein" onclick="PF('endWorkoutDialog').hide(); return false;"
                                     styleClass="ui-button-raised ui-button-danger"/>
                </div>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
</html>
