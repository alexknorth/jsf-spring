<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <title>Power! - #{pageTitle}</title>

        <!-- Tailwind CSS CDN einbinden -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Weitere Stylesheets -->
        <h:outputStylesheet library="musicshop" name="css/default.css"/>
    </h:head>
    <h:body class="bg-gray-50">
        <ui:include src="/templates/page-header.xhtml"/>

        <ui:insert name="panel-top">
            <ui:include src="/templates/panel-top-default.xhtml"/>
        </ui:insert>

        <ui:insert name="panel-main">
            <div class="p-6 bg-white rounded-lg shadow-md">
                <h1 class="text-3xl font-bold">Main Panel</h1>
                <p class="text-gray-700">Placeholder text.</p>
            </div>
        </ui:insert>

        <ui:include src="/templates/page-footer.xhtml"/>
    </h:body>
</f:view>
</html>
