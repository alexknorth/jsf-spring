<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:body>
    <section class="top-panel bg-gray-100 p-6 shadow-md">
        <!-- Burger Menu -->
        <div class="menu-wrapper flex justify-between items-center">
            <h:form>
                <p:menuButton icon="pi pi-bars" value="Menu" styleClass="burger-menu bg-blue-500 text-white rounded-md p-2">
                    <p:menuitem value="Profile" outcome="profile.xhtml?faces-redirect=true"
                                style="#{menuBean.isActive('/profile.xhtml') ? 'font-weight: bold; color: red;' : ''}" />
                    <p:menuitem value="Recent" outcome="recent.xhtml?faces-redirect=true"
                                style="#{menuBean.isActive('/recent.xhtml') ? 'font-weight: bold; color: red;' : ''}" />
                    <p:menuitem value="Workout" outcome="workout.xhtml?faces-redirect=true"
                                style="#{menuBean.isActive('/workout.xhtml') ? 'font-weight: bold; color: red;' : ''}" />
                    <p:menuitem value="Exercises" outcome="exercises.xhtml?faces-redirect=true"
                                style="#{menuBean.isActive('/exercises.xhtml') ? 'font-weight: bold; color: red;' : ''}" />
                    <p:menuitem value="Index" outcome="index.xhtml?faces-redirect=true"
                                style="#{menuBean.isActive('index') ? '' : 'font-weight: bold'}" />
                </p:menuButton>
            </h:form>
        </div>
        <ui:insert name="top-message"/>
    </section>
</h:body>
</html>
