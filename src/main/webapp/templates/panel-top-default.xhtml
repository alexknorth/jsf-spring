<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition>
    <section>
       
        <ui:fragment rendered="#{not userManager.signedIn}">
            <h1>Welcome, visitor!</h1>
            <p>Please sign in
                or <h:outputLink value="user-details.xhtml">register</h:outputLink>.</p>
        </ui:fragment>

        <ui:fragment rendered="#{userManager.signedIn}">
            <h:form>
                <h1>Welcome, #{userManager.currentUser.firstName}!</h1>
                <!-- Button für das Ändern der User Daten -->
                <h:commandButton value="Update user data" action="user-details.xhtml?faces-redirect=true" />
                <!-- Button für den Logout -->
                <h:commandButton value="Sign out" action="#{userManager.signOut}"/>
            </h:form>
        </ui:fragment>
    </section>
</ui:composition>
</html>
