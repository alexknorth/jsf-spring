<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"> <!-- Hier wird der 'f' Namensraum hinzugefügt -->>
<ui:composition template="/templates/page-template.xhtml">
    <ui:param name="pageTitle" value="Support Tickets"/>
    <ui:define name="panel-main">
        <!-- Vor dem Rendering der Seite prüfen, ob der Benutzer angemeldet ist -->
        <f:metadata>
            <f:event type="preRenderView" listener="#{userManager.checkAccess}" />
        </f:metadata>

        <section>
            <h1>Open Tickets</h1>
            <ui:debug hotkey="e"/>
            <h:form>
                <ui:repeat value="#{ticketManager.tickets}" var="ticket">
                    <div class="ticket-summary">
                    <h2>#{ticket.ticketName}</h2>
                    <p><strong>Status:</strong> #{ticket.status}</p>
                    <p><strong>Priorität:</strong> #{ticket.prio}</p>
                    <p><strong>Beschreibung:</strong> #{ticket.description}</p>
                    <p><strong>Erstellungsdatum:</strong> #{ticket.creationDate} #{ticket.creationTime}</p>

                        <!-- Button/Link zu den Details -->
                        <h:commandButton value="View Details" action="#{ticketDetails.loadTicketDetails(ticket.id)}">
                            <f:param name="ticketId" value="#{ticket.id}" />
                        </h:commandButton>
                    </div>
                </ui:repeat>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
</html>
