<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"> <!-- Hier wird der 'f' & 'p' Namensraum hinzugefügt -->>
<ui:composition template="/templates/page-template.xhtml">
    <ui:param name="pageTitle" value="Support Tickets"/>
    <!-- Top Panel ersetzen -->
    <ui:define name="panel-top">
        <section class="panel-top">
            <h1>Dashboard</h1>
            <h:form>
                    <p:menuButton icon="pi pi-bars" styleClass="right-menu-button">
                        <!-- Button für das Hinzufügen eines neuen Tickets -->
                        <p:menuitem value="Add New Ticket" action="ticket-details.xhtml?faces-redirect=true" />
                        <!-- Button für das Ändern der User Daten -->
                        <p:menuitem value="Change user data" action="user-details.xhtml?faces-redirect=true" />
                        <!-- Button für den Logout -->
                        <p:menuitem value="Sign out" action="#{userManager.signOut}"/>
                    </p:menuButton>
            </h:form>
        </section>
    </ui:define>
    <!-- Main Panel füllen -->
    <ui:define name="panel-main">
        <!-- Vor dem Rendering der Seite prüfen, ob der Benutzer angemeldet ist -->
        <f:metadata>
            <f:event type="preRenderView" listener="#{userManager.checkAccess}" />
        </f:metadata>

        <section>
            <h1>Open Tickets</h1>
            <ui:debug hotkey="e"/>
            <h:form>
                <ui:repeat value="#{ticketManager.tickets}" var="ticket">
                    <div class="ticket-summary">
                        <p><strong>Ticket name:</strong> #{ticket.ticketName}</p>
                        <p><strong>Status:</strong> #{ticket.status}</p>
                        <p><strong>Prio:</strong> #{ticket.prio}</p>
                        <p><strong>Description:</strong> #{ticket.description}</p>
                        <p><strong>Creation date:</strong> #{ticket.creationDate} #{ticket.creationTime}</p>

                        <!-- Button/Link zu den Details -->
                        <p>
                            <p:commandButton value="View Details" action="#{ticketDetails.loadTicketDetails(ticket.id)}"
                                             styleClass="view-details-button">
                                <f:param name="ticketId" value="#{ticket.id}" />
                            </p:commandButton>
                        </p>
                    </div>
                </ui:repeat>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
</html>
