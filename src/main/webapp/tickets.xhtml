<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"> <!-- Hier wird der 'f' & 'p' Namensraum hinzugefügt -->>
<ui:composition template="/templates/page-template.xhtml">
    <ui:param name="pageTitle" value="Support Tickets"/>
    <!-- Top Panel ersetzen -->
    <ui:define name="panel-top">
        <section class="panel-top">
            <h1>Dashboard</h1>
            <h:form>
                    <p:menuButton icon="pi pi-bars" styleClass="right-menu-button">
                        <!-- Button für das Hinzufügen eines neuen Tickets -->
                        <p:menuitem value="Add New Ticket" action="ticket-details.xhtml?faces-redirect=true&amp;new=true" />
                        <!-- Button für das Ändern der User Daten -->
                        <p:menuitem value="Change user data" action="user-details.xhtml?faces-redirect=true" />
                        <!-- Button für den Logout -->
                        <p:menuitem value="Sign out" action="#{userManager.signOut}"/>
                    </p:menuButton>
            </h:form>
        </section>
    </ui:define>
    <!-- Main Panel füllen -->
    <ui:define name="panel-main">
        <f:metadata>
            <f:event type="preRenderView" listener="#{userManager.checkAccess}" />
        </f:metadata>

        <section>
            <h1>Open Tickets</h1>
            <h:form id="form">
                <!-- Tabellenerstellung, ruft TicketManager.getTickets() auf -->
                <p:dataTable value="#{ticketManager.tickets}" var="ticket"
                             styleClass="tickets-table"
                             responsiveLayout="scroll"
                             paginator="true" rows="10"
                             paginatorPosition="bottom"
                             rowKey="#{ticket.id}" emptyMessage="No tickets found.">

                    <!-- Ticket ID Spalte -->
                    <p:column>
                        <f:facet name="header">
                            <p:outputLabel value="Ticket ID" styleClass="clickable-header"
                                           onclick="PF('filterDialogTicketId').show()" />
                        </f:facet>
                        #{ticket.id}
                    </p:column>

                    <!-- Ticket Name Spalte -->
                    <p:column>
                        <f:facet name="header">
                            <p:outputLabel value="Ticket Name" styleClass="clickable-header"
                                           onclick="PF('filterDialogTicketName').show()" />
                        </f:facet>
                        #{ticket.ticketName}
                    </p:column>

                    <!-- Status Spalte -->
                    <p:column>
                        <f:facet name="header">
                            <p:outputLabel value="Status" styleClass="clickable-header"
                                           onclick="PF('filterDialogStatus').show()" />
                        </f:facet>
                        #{ticket.status}
                    </p:column>

                    <!-- Priority Spalte -->
                    <p:column>
                        <f:facet name="header">
                            <p:outputLabel value="Priority" styleClass="clickable-header"
                                           onclick="PF('filterDialogPriority').show()" />
                        </f:facet>
                        #{ticket.prio}
                    </p:column>

                    <!-- Creation Date Spalte -->
                    <p:column>
                        <f:facet name="header">
                            <p:outputLabel value="Creation Date" styleClass="clickable-header"
                                           onclick="PF('filterDialogCreationDate').show()" />
                        </f:facet>
                        #{ticket.creationDate}
                    </p:column>

                    <!-- Actions -->
                    <p:column headerText="Actions">
                        <p:commandButton value="View Details" action="#{ticketDetails.loadTicketDetails(ticket.id)}"
                                         styleClass="view-details-button">
                            <f:param name="Id" value="#{ticket.id}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <!-- Dialoge für Filter -->
                <!-- Filterdialog für Ticket ID -->
                <p:dialog header="Filter: Ticket ID" widgetVar="filterDialogTicketId" modal="true" closable="true">
                    <h:panelGrid columns="2">
                        <h:outputLabel value="Filter value:" />
                        <p:inputText value="#{ticketManager.filterTicketId}" />

                        <h:outputLabel />
                        <p:commandButton value="Apply Filter" action="#{ticketManager.applyFilters()}"
                                         oncomplete="PF('filterDialogTicketId').hide()" update=":form" />
                    </h:panelGrid>
                </p:dialog>

                <!-- Filterdialog für Ticket Name -->
                <p:dialog header="Filter: Ticket Name" widgetVar="filterDialogTicketName" modal="true" closable="true">
                    <h:panelGrid columns="2">
                        <h:outputLabel value="Filter value:" />
                        <p:inputText value="#{ticketManager.filterTicketName}" />

                        <h:outputLabel />
                        <p:commandButton value="Apply Filter" action="#{ticketManager.applyFilters()}"
                                         oncomplete="PF('filterDialogTicketName').hide()" update=":form" />
                    </h:panelGrid>
                </p:dialog>

                <!-- Filterdialog für Status -->
                <p:dialog header="Filter: Status" widgetVar="filterDialogStatus" modal="true" closable="true">
                    <h:panelGrid columns="2">
                        <h:outputLabel value="Filter value:" />
                        <p:inputText value="#{ticketManager.filterStatus}" />

                        <h:outputLabel />
                        <p:commandButton value="Apply Filter" action="#{ticketManager.applyFilters()}"
                                         oncomplete="PF('filterDialogStatus').hide()" update=":form" />
                    </h:panelGrid>
                </p:dialog>

                <!-- Filterdialog für Priority -->
                <p:dialog header="Filter: Priority" widgetVar="filterDialogPriority" modal="true" closable="true">
                    <h:panelGrid columns="2">
                        <h:outputLabel value="Filter value:" />
                        <p:inputText value="#{ticketManager.filterPriority}" />

                        <h:outputLabel />
                        <p:commandButton value="Apply Filter" action="#{ticketManager.applyFilters()}"
                                         oncomplete="PF('filterDialogPriority').hide()" update=":form" />
                    </h:panelGrid>
                </p:dialog>

                <!-- Filterdialog für Creation Date -->
                <p:dialog header="Filter: Creation Date" widgetVar="filterDialogCreationDate" modal="true" closable="true">
                    <h:panelGrid columns="2">
                        <h:outputLabel value="Filter value:" />
                        <p:inputText value="#{ticketManager.filterCreationDate}" />

                        <h:outputLabel />
                        <p:commandButton value="Apply Filter" action="#{ticketManager.applyFilters()}"
                                         oncomplete="PF('filterDialogCreationDate').hide()" update=":form" />
                    </h:panelGrid>
                </p:dialog>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
</html>
